name: Theme Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a new version or recover a missing source tag
        required: true
        default: publish
        type: choice
        options:
          - publish
          - recover-tag
      version:
        description: Exact @aeei/docusaurus-theme version from package.json
        required: true
        type: string
      confirmation:
        description: Type the operation-specific confirmation shown in UPSTREAM.md
        required: true
        type: string

permissions: {}

concurrency:
  group: theme-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build immutable theme artifact
    if: ${{ github.repository == 'aeei/docusaurus-theme' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      file: ${{ steps.package.outputs.file }}
      integrity: ${{ steps.package.outputs.integrity }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: yarn
      - run: npm install --global npm@11.16.0

      - name: Validate explicit release intent
        id: intent
        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          actual=$(node -p "require('./packages/docusaurus-theme/package.json').version")
          test "$actual" = "$VERSION"
          case "$OPERATION" in
            publish) expected="publish @aeei/docusaurus-theme@${VERSION}" ;;
            recover-tag) expected="recover theme-v${VERSION} for @aeei/docusaurus-theme@${VERSION}" ;;
            *) echo "Unsupported operation: $OPERATION" >&2; exit 1 ;;
          esac
          test "$CONFIRMATION" = "$expected"
          if git ls-remote --exit-code --tags origin "refs/tags/theme-v${VERSION}" >/dev/null 2>&1; then
            echo "theme-v${VERSION} already exists" >&2
            exit 1
          fi
          published=$(npm view "@aeei/docusaurus-theme@${VERSION}" dist.integrity 2>/dev/null || true)
          if [ "$OPERATION" = publish ]; then
            test -z "$published"
          else
            test -n "$published"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn workspace @aeei/docusaurus-theme build
      - name: Theme release contracts
        run: >-
          NODE_OPTIONS=--experimental-vm-modules yarn jest
          packages/docusaurus-theme/src/package-contract.test.ts
          packages/docusaurus-theme/src/legal-notices.test.ts
          examples/docs-starter/config-contract.test.ts
          --runInBand
      - run: yarn workspace @aeei/docs-starter build

      - name: Pack immutable artifact
        id: package
        working-directory: packages/docusaurus-theme
        run: |
          file=$(npm pack --silent)
          mv "$file" "$GITHUB_WORKSPACE/$file"
          integrity=$(node -e "const fs=require('fs'),crypto=require('crypto'); const bytes=fs.readFileSync(process.argv[1]); process.stdout.write('sha512-'+crypto.createHash('sha512').update(bytes).digest('base64'))" "$GITHUB_WORKSPACE/$file")
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$integrity" "$file"

      - name: Verify recovery artifact
        if: ${{ inputs.operation == 'recover-tag' }}
        env:
          VERSION: ${{ inputs.version }}
          INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: test "$(npm view "@aeei/docusaurus-theme@${VERSION}" dist.integrity)" = "$INTEGRITY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aeei-docusaurus-theme-${{ inputs.version }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish and tag approved artifact
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: theme-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aeei-docusaurus-theme-${{ needs.prepare.outputs.version }}

      - name: Verify downloaded artifact
        env:
          FILE: ${{ needs.prepare.outputs.file }}
          INTEGRITY: ${{ needs.prepare.outputs.integrity }}
        run: |
          actual=$(node -e "const fs=require('fs'),crypto=require('crypto'); const bytes=fs.readFileSync(process.argv[1]); process.stdout.write('sha512-'+crypto.createHash('sha512').update(bytes).digest('base64'))" "$FILE")
          test "$actual" = "$INTEGRITY"

      - name: Publish theme through npm trusted publishing
        if: ${{ inputs.operation == 'publish' }}
        env:
          FILE: ${{ needs.prepare.outputs.file }}
        run: npm publish "$FILE" --access public

      - name: Verify registry and create immutable source tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          INTEGRITY: ${{ needs.prepare.outputs.integrity }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          registry_integrity=""
          for _ in $(seq 1 12); do
            registry_integrity=$(npm view "@aeei/docusaurus-theme@${VERSION}" dist.integrity 2>/dev/null || true)
            [ -n "$registry_integrity" ] && break
            sleep 5
          done
          test "$registry_integrity" = "$INTEGRITY"
          if gh api "repos/${REPOSITORY}/git/ref/tags/theme-v${VERSION}" >/dev/null 2>&1; then
            echo "theme-v${VERSION} already exists" >&2
            exit 1
          fi
          tag_sha=$(gh api --method POST "repos/${REPOSITORY}/git/tags" \
            -f tag="theme-v${VERSION}" \
            -f message="@aeei/docusaurus-theme ${VERSION}" \
            -f object="$TARGET_SHA" \
            -f type=commit \
            --jq .sha)
          gh api --method POST "repos/${REPOSITORY}/git/refs" \
            -f ref="refs/tags/theme-v${VERSION}" \
            -f sha="$tag_sha"
