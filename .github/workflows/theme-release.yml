name: Theme Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @aeei/docusaurus-theme version from package.json
        required: true
        type: string
      confirmation:
        description: Type "publish @aeei/docusaurus-theme@<version>"
        required: true
        type: string

permissions: {}

concurrency:
  group: theme-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @aeei/docusaurus-theme
    if: ${{ github.repository == 'aeei/docusaurus-theme' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: theme-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Validate explicit release intent
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          actual=$(node -p "require('./packages/docusaurus-theme/package.json').version")
          expected="publish @aeei/docusaurus-theme@${VERSION}"
          test "$actual" = "$VERSION"
          test "$CONFIRMATION" = "$expected"
          if git rev-parse "refs/tags/theme-v${VERSION}" >/dev/null 2>&1; then
            echo "theme-v${VERSION} already exists" >&2
            exit 1
          fi
          if npm view "@aeei/docusaurus-theme@${VERSION}" version >/dev/null 2>&1; then
            echo "@aeei/docusaurus-theme@${VERSION} is already published" >&2
            exit 1
          fi

      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn workspace @aeei/docusaurus-theme build
      - name: Theme release contracts
        run: >-
          NODE_OPTIONS=--experimental-vm-modules yarn jest
          packages/docusaurus-theme/src/package-contract.test.ts
          packages/docusaurus-theme/src/legal-notices.test.ts
          examples/docs-starter/config-contract.test.ts
          --runInBand
      - run: yarn workspace @aeei/docs-starter build
      - name: Package contents
        working-directory: packages/docusaurus-theme
        run: npm pack --dry-run
      - name: Publish theme through npm trusted publishing
        working-directory: packages/docusaurus-theme
        run: npm publish --access public
      - name: Tag published source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "theme-v${VERSION}" -m "@aeei/docusaurus-theme ${VERSION}"
          git push origin "theme-v${VERSION}"
